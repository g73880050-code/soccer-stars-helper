name: Build Soccer Stars Analyzer APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_HOME:          /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT:      /usr/local/lib/android/sdk
  ANDROIDSDK:            /usr/local/lib/android/sdk
  ANDROIDNDK:            /usr/local/lib/android/sdk/ndk/25.1.8937393
  ANDROID_NDK_HOME:      /usr/local/lib/android/sdk/ndk/25.1.8937393
  ANDROIDAPI:            "33"
  ANDROIDMINAPI:         "26"
  ANDROIDNDKAPI:         "26"
  ANDROID_NDK_VERSION:   "25.1.8937393"
  TARGET_BT:             "33.0.0"
  GRADLE_OPTS:           "-Dorg.gradle.daemon=false"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:  17

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev \
            libncurses6 libncursesw6 \
            libssl-dev libffi-dev \
            libsqlite3-dev \
            build-essential ccache cmake ninja-build gettext

      - name: Install Buildozer 1.5.0 and Cython
        run: |
          pip install --upgrade pip wheel setuptools
          pip install "cython==3.0.10"
          pip install "buildozer==1.5.0"
          buildozer --version

      - name: Accept all Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Build-Tools 33.0.0 and Platform 33
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;33.0.0" \
            "platforms;android-33"

      - name: Create symlink 37.0.0 → 33.0.0 (symlink trick)
        run: |
          BT_DIR="$ANDROID_HOME/build-tools"
          echo "Build-tools directory before symlink:"
          ls "$BT_DIR"

          sudo rm -rf "$BT_DIR/37.0.0" "$BT_DIR/37.0.0-rc1" "$BT_DIR/37.0.0-rc3"
          sudo ln -sf "$BT_DIR/33.0.0" "$BT_DIR/37.0.0"

          echo ""
          echo "Build-tools directory after symlink:"
          ls -la "$BT_DIR"
          echo ""
          echo "Symlink target:"
          readlink -f "$BT_DIR/37.0.0"

      - name: Inject Build-Tools 33.0.0 first in PATH
        run: |
          echo "$ANDROID_HOME/build-tools/33.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"      >> "$GITHUB_PATH"

      - name: Verify aidl is reachable
        run: |
          which aidl
          aidl --version || true
          echo "aidl binary: $(readlink -f $(which aidl))"

      - name: Install NDK 25.1.8937393 (r25b)
        run: |
          sdkmanager "ndk;25.1.8937393"

      - name: Verify NDK
        run: |
          if [ ! -f "$ANDROIDNDK/ndk-build" ]; then
            echo "ERROR: ndk-build not found at $ANDROIDNDK"
            ls "$ANDROID_HOME/ndk/" || true
            exit 1
          fi
          echo "NDK OK: $ANDROIDNDK"

      - name: Cache Buildozer app recipes
        uses: actions/cache@v4
        with:
          path: .buildozer/android/app
          key: buildozer-app-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-app-${{ runner.os }}-

      - name: Pre-build environment check
        run: |
          echo "=== Java ===" && java -version
          echo "=== Python ===" && python --version
          echo "=== Buildozer ===" && buildozer --version
          echo "=== aidl ===" && which aidl && aidl --version || true
          echo "=== ANDROID_HOME ===" && echo "$ANDROID_HOME"
          echo "=== ANDROIDNDK ===" && echo "$ANDROIDNDK"
          echo "=== Build-tools ===" && ls "$ANDROID_HOME/build-tools/"
          echo "=== NDK entries ===" && ls "$ANDROID_HOME/ndk/" 2>/dev/null || true

      - name: Build debug APK
        env:
          ANDROID_HOME:     /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK:       /usr/local/lib/android/sdk
          ANDROIDNDK:       /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROIDAPI:       "33"
          ANDROIDMINAPI:    "26"
          ANDROIDNDKAPI:    "26"
          GRADLE_OPTS:      "-Dorg.gradle.daemon=false"
        run: |
          buildozer -v android debug 2>&1 | tee buildozer_build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-stars-analyzer-debug-apk
          path: ./bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-failure-log
          path: ./buildozer_build.log
          retention-days: 7
          if-no-files-found: ignore
