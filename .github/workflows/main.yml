name: Build Soccer Stars Analyzer APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_HOME:        /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT:    /usr/local/lib/android/sdk
  ANDROIDSDK:          /usr/local/lib/android/sdk
  ANDROIDNDK:          /usr/local/lib/android/sdk/ndk/25.1.8937393
  ANDROID_NDK_HOME:    /usr/local/lib/android/sdk/ndk/25.1.8937393
  ANDROIDAPI:          "33"
  ANDROIDMINAPI:       "26"
  ANDROIDNDKAPI:       "26"
  ANDROID_NDK_VERSION: "25.1.8937393"
  TARGET_BT:           "33.0.0"
  GRADLE_OPTS:         "-Dorg.gradle.daemon=false"

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:  17

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev \
            libncurses6 libncursesw6 \
            libssl-dev libffi-dev \
            libsqlite3-dev \
            build-essential ccache cmake ninja-build gettext

      - name: Install Buildozer 1.5.0 and Cython
        run: |
          pip install --upgrade pip wheel setuptools
          pip install "cython==3.0.10"
          pip install "buildozer==1.5.0"
          buildozer --version

      # ======================================================================
      # LOCATE OR INSTALL sdkmanager
      #
      # Probes all known paths on the ubuntu-22.04 runner image in order.
      # If none exist, downloads cmdline-tools directly from Google.
      # Exports SDK_MANAGER so every later step uses the same binary.
      # ======================================================================
      - name: Locate or install sdkmanager
        run: |
          locate_sdkmanager() {
            # Priority 1 — cmdline-tools/latest  (most common on 22.04)
            if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              return
            fi
            # Priority 2 — any versioned cmdline-tools subfolder
            local found
            found=$(ls "$ANDROID_HOME/cmdline-tools/" 2>/dev/null \
                    | grep -v latest \
                    | sort -rV \
                    | head -1)
            if [ -n "$found" ] && \
               [ -f "$ANDROID_HOME/cmdline-tools/$found/bin/sdkmanager" ]; then
              echo "$ANDROID_HOME/cmdline-tools/$found/bin/sdkmanager"
              return
            fi
            # Priority 3 — legacy tools/bin location
            if [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
              echo "$ANDROID_HOME/tools/bin/sdkmanager"
              return
            fi
            echo ""
          }

          SDK_MGR=$(locate_sdkmanager)

          if [ -z "$SDK_MGR" ]; then
            echo "sdkmanager not found — downloading cmdline-tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            mv /tmp/cmdline-unpack/cmdline-tools \
               "$ANDROID_HOME/cmdline-tools/latest"
            SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            echo "Installed sdkmanager at: $SDK_MGR"
          else
            echo "Found sdkmanager at: $SDK_MGR"
          fi

          echo "SDK_MANAGER=$SDK_MGR" >> "$GITHUB_ENV"

      - name: Accept all Android SDK licenses
        run: |
          yes | "$SDK_MANAGER" --licenses 2>/dev/null || true
          yes | "$SDK_MANAGER" --licenses 2>/dev/null || true

      - name: Install Build-Tools 33.0.0 and Platform 33
        run: |
          "$SDK_MANAGER" \
            "platform-tools" \
            "build-tools;33.0.0" \
            "platforms;android-33"

      # ======================================================================
      # SYMLINK TRICK
      # Any tool that hard-codes build-tools/37.0.0 transparently gets
      # the stable v33 binaries via this symlink.
      # ======================================================================
      - name: Symlink build-tools 37.0.0 → 33.0.0
        run: |
          BT_DIR="$ANDROID_HOME/build-tools"
          echo "Build-tools before:"
          ls "$BT_DIR"

          sudo rm -rf \
            "$BT_DIR/37.0.0" \
            "$BT_DIR/37.0.0-rc1" \
            "$BT_DIR/37.0.0-rc3"

          sudo ln -sf "$BT_DIR/33.0.0" "$BT_DIR/37.0.0"

          echo "Build-tools after:"
          ls -la "$BT_DIR"
          echo "Symlink resolves to: $(readlink -f "$BT_DIR/37.0.0")"

      # ======================================================================
      # PATH INJECTION
      # Build-Tools 33 is prepended so aidl, d8, apksigner always
      # resolve from v33 regardless of what Buildozer appends later.
      # ======================================================================
      - name: Inject Build-Tools 33.0.0 first in PATH
        run: |
          echo "$ANDROID_HOME/build-tools/33.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"      >> "$GITHUB_PATH"

      - name: Verify aidl is reachable
        run: |
          which aidl
          aidl --version || true
          echo "aidl resolves to: $(readlink -f "$(which aidl)")"

      # ======================================================================
      # NDK r25b (25.1.8937393)
      # ======================================================================
      - name: Install NDK 25.1.8937393 (r25b)
        run: |
          "$SDK_MANAGER" "ndk;25.1.8937393"

      - name: Verify NDK
        run: |
          if [ ! -f "$ANDROIDNDK/ndk-build" ]; then
            echo "ERROR: ndk-build not found at $ANDROIDNDK"
            ls "$ANDROID_HOME/ndk/" || true
            exit 1
          fi
          echo "NDK OK: $ANDROIDNDK"

      - name: Cache Buildozer app recipes
        uses: actions/cache@v4
        with:
          path: .buildozer/android/app
          key: buildozer-app-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-app-${{ runner.os }}-

      - name: Pre-build environment check
        run: |
          echo "=== Java ===" && java -version
          echo "=== Python ===" && python --version
          echo "=== Buildozer ===" && buildozer --version
          echo "=== sdkmanager ===" && echo "$SDK_MANAGER"
          echo "=== aidl ===" && which aidl && aidl --version || true
          echo "=== ANDROID_HOME ===" && echo "$ANDROID_HOME"
          echo "=== ANDROIDNDK ===" && echo "$ANDROIDNDK"
          echo "=== Build-tools ===" && ls "$ANDROID_HOME/build-tools/"
          echo "=== NDK ===" && ls "$ANDROID_HOME/ndk/" 2>/dev/null || true

      # ======================================================================
      # BUILD — all env vars re-declared at process level
      # ======================================================================
      - name: Build debug APK
        env:
          ANDROID_HOME:     /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK:       /usr/local/lib/android/sdk
          ANDROIDNDK:       /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROIDAPI:       "33"
          ANDROIDMINAPI:    "26"
          ANDROIDNDKAPI:    "26"
          GRADLE_OPTS:      "-Dorg.gradle.daemon=false"
        run: |
          buildozer -v android debug 2>&1 | tee buildozer_build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-stars-analyzer-debug-apk
          path: ./bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-failure-log
          path: ./buildozer_build.log
          retention-days: 7
          if-no-files-found: ignore
